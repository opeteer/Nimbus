version: '3.8'

services:
  nimbus:
    build: .
    container_name: nimbus
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./templates:/app/templates
      - ./static:/app/static
      - ./main.py:/app/main.py
    environment:
      # Set your secure password here (used for web login)
      - NIMBUS_PASSWORD=nimbus123
      # Optional: custom path to YouTube cookies.txt (default persists in ./downloads/cookies.txt)
      # - NIMBUS_COOKIES_FILE=/app/downloads/cookies.txt
    restart: unless-stopped
