<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbus Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            850: '#202024',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(39, 39, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen font-sans antialiased selection:bg-cyan-500/30">

    {% if not is_auth %}
    <!-- Login Modal -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-2xl p-8 w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white tracking-tight flex items-center justify-center gap-2">
                    <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                    Nimbus
                </h1>
                <p class="text-sm text-zinc-400 mt-2">Enter password to access</p>
            </div>
            
            <form action="/api/login" method="POST" class="space-y-4">
                <div>
                    <input type="password" name="password" required autofocus
                        class="w-full bg-zinc-900/50 border border-zinc-700/50 rounded-xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-transparent transition-all"
                        placeholder="Password">
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-cyan-900/20">
                    Unlock
                </button>
            </form>
        </div>
    </div>
    {% else %}
    
    <!-- Main App -->
    <div x-data="nimbusApp()" x-init="initApp()" class="max-w-4xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- Header -->
        <header class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-zinc-900 rounded-xl border border-zinc-800">
                    <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Nimbus</h1>
            </div>
            <form action="/api/logout" method="POST">
                <button type="submit" class="text-sm text-zinc-500 hover:text-white transition-colors">Logout</button>
            </form>
        </header>

        <!-- Input Section -->
        <section class="glass rounded-2xl p-2 shadow-2xl relative overflow-hidden">
            <!-- Animated background glow -->
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 to-indigo-500/10 opacity-50 pointer-events-none"></div>
            
            <form @submit.prevent="submitDownload" class="relative z-10 flex flex-col md:flex-row gap-2">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>
                    <input type="url" x-model="url" required autofocus
                        class="w-full bg-zinc-900/80 border border-zinc-700/50 rounded-xl pl-12 pr-4 py-4 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-lg"
                        placeholder="Paste video URL here...">
                </div>
                
                <div class="flex gap-2">
                    <!-- Format Toggle -->
                    <div class="flex bg-zinc-900/80 border border-zinc-700/50 rounded-xl p-1 shrink-0">
                        <button type="button" @click="format = 'video'" :class="{'bg-zinc-700 text-white shadow-sm': format === 'video', 'text-zinc-400 hover:text-zinc-200': format !== 'video'}" class="px-4 py-3 rounded-lg text-sm font-medium transition-all">
                            Video
                        </button>
                        <button type="button" @click="format = 'audio'" :class="{'bg-zinc-700 text-white shadow-sm': format === 'audio', 'text-zinc-400 hover:text-zinc-200': format !== 'audio'}" class="px-4 py-3 rounded-lg text-sm font-medium transition-all">
                            Audio
                        </button>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" :disabled="isSubmitting" class="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-4 rounded-xl font-medium transition-colors shadow-lg shadow-cyan-900/20 shrink-0 flex items-center gap-2">
                        <span x-show="!isSubmitting">Download</span>
                        <svg x-show="isSubmitting" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </section>

        <!-- Active Downloads -->
        <section x-show="Object.keys(activeDownloads).length > 0" x-cloak>
            <h2 class="text-sm font-semibold text-zinc-500 uppercase tracking-wider mb-4">Active Downloads</h2>
            <div class="space-y-3">
                <template x-for="[id, task] in Object.entries(activeDownloads)" :key="id">
                    <div class="glass rounded-xl p-4 flex flex-col gap-3">
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-grow min-w-0">
                                <h3 class="text-zinc-200 font-medium truncate" x-text="task.title"></h3>
                                <div class="text-xs text-zinc-500 mt-1 flex gap-3">
                                    <span class="flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                        <span x-text="task.speed"></span>
                                    </span>
                                    <span class="flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span x-text="task.eta"></span>
                                    </span>
                                    <span class="flex items-center gap-1 uppercase">
                                        <span class="px-1.5 py-0.5 rounded bg-zinc-800 text-[10px] font-bold" x-text="task.format"></span>
                                    </span>
                                </div>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="text-cyan-400 font-mono text-sm" x-text="task.progress_percent"></span>
                            </div>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                            <div class="h-full bg-cyan-500 transition-all duration-300 ease-out" 
                                 :style="`width: ${task.progress_percent.replace('%','')}%`"></div>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Completed Files -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-zinc-500 uppercase tracking-wider">Completed Files</h2>
                <button @click="fetchFiles" class="text-xs text-cyan-500 hover:text-cyan-400 flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh
                </button>
            </div>
            
            <div class="glass rounded-xl overflow-hidden shadow-lg border border-zinc-800">
                <ul class="divide-y divide-zinc-800/50 max-h-[500px] overflow-y-auto">
                    <template x-for="file in files" :key="file.name">
                        <li class="p-4 hover:bg-zinc-800/30 transition-colors flex items-center justify-between gap-4 group">
                            <div class="min-w-0 flex-grow">
                                <p class="text-sm font-medium text-zinc-300 truncate" x-text="file.name"></p>
                                <p class="text-xs text-zinc-500 mt-0.5" x-text="formatBytes(file.size)"></p>
                            </div>
                            
                            <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button @click="previewFile(file.name)" class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-700 rounded-lg transition-colors" title="Preview">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </button>
                                <a :href="`/api/files/${file.name}?download=1`" class="p-2 text-zinc-400 hover:text-cyan-400 hover:bg-zinc-700 rounded-lg transition-colors" title="Download to Laptop">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </a>
                                <button @click="deleteFile(file.name)" class="p-2 text-zinc-400 hover:text-red-400 hover:bg-zinc-700 rounded-lg transition-colors" title="Delete">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </li>
                    </template>
                    <li x-show="files.length === 0" class="p-8 text-center text-zinc-500 text-sm">
                        No downloaded files yet.
                    </li>
                </ul>
            </div>
        </section>

        <!-- Preview Modal -->
        <div x-show="preview.show" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
            <div @click.away="closePreview" class="bg-zinc-900 rounded-2xl border border-zinc-800 w-full max-w-4xl overflow-hidden shadow-2xl">
                <div class="flex justify-between items-center p-4 border-b border-zinc-800">
                    <h3 class="text-zinc-200 font-medium truncate pr-4" x-text="preview.filename"></h3>
                    <button @click="closePreview" class="text-zinc-500 hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="bg-black flex justify-center items-center p-4">
                    <template x-if="preview.type === 'video'">
                        <video :src="preview.url" controls autoplay class="max-h-[60vh] w-auto max-w-full rounded"></video>
                    </template>
                    <template x-if="preview.type === 'audio'">
                        <audio :src="preview.url" controls autoplay class="w-full max-w-md my-8"></audio>
                    </template>
                </div>
            </div>
        </div>

    </div>

    <script>
        function nimbusApp() {
            return {
                url: '',
                format: 'video',
                isSubmitting: false,
                activeDownloads: {},
                files: [],
                ws: null,
                preview: { show: false, url: '', filename: '', type: 'video' },

                initApp() {
                    this.fetchFiles();
                    this.connectWebSocket();
                },

                async submitDownload() {
                    if (!this.url) return;
                    this.isSubmitting = true;
                    try {
                        const res = await fetch('/api/download', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: this.url, format: this.format })
                        });
                        if (res.ok) {
                            this.url = ''; // Clear input on success
                        } else {
                            alert('Failed to start download');
                        }
                    } catch (e) {
                        alert('Network error');
                    }
                    this.isSubmitting = false;
                },

                async fetchFiles() {
                    try {
                        const res = await fetch('/api/files');
                        if (res.ok) {
                            const data = await res.json();
                            this.files = data.files;
                        }
                    } catch (e) {
                        console.error('Failed to fetch files');
                    }
                },

                async deleteFile(filename) {
                    if (!confirm(`Delete ${filename}?`)) return;
                    try {
                        const res = await fetch(`/api/files/${encodeURIComponent(filename)}`, { method: 'DELETE' });
                        if (res.ok) {
                            this.fetchFiles();
                        }
                    } catch (e) {
                        console.error('Delete failed');
                    }
                },

                previewFile(filename) {
                    this.preview.filename = filename;
                    this.preview.url = `/api/files/${encodeURIComponent(filename)}`;
                    this.preview.type = filename.endsWith('.mp3') || filename.endsWith('.m4a') ? 'audio' : 'video';
                    this.preview.show = true;
                },

                closePreview() {
                    this.preview.show = false;
                    this.preview.url = ''; // stop playback
                },

                connectWebSocket() {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    this.ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
                    
                    this.ws.onmessage = (event) => {
                        const state = JSON.parse(event.data);
                        
                        // Filter active downloads and update UI
                        let hasCompletedOrError = false;
                        const active = {};
                        
                        for (const [id, task] of Object.entries(state)) {
                            if (task.status === 'completed' || task.status === 'error') {
                                if (!this.activeDownloads[id] || this.activeDownloads[id].status !== task.status) {
                                    hasCompletedOrError = true;
                                }
                            } else {
                                active[id] = task;
                            }
                        }
                        
                        this.activeDownloads = active;
                        
                        if (hasCompletedOrError) {
                            this.fetchFiles(); // Refresh file list when a download finishes
                        }
                    };

                    this.ws.onclose = () => {
                        setTimeout(() => this.connectWebSocket(), 3000); // Reconnect
                    };
                },

                formatBytes(bytes, decimals = 2) {
                    if (!+bytes) return '0 Bytes';
                    const k = 1024;
                    const dm = decimals < 0 ? 0 : decimals;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
                }
            }
        }
    </script>
    {% endif %}
</body>
</html>
