name: Build, Push to GHCR, and Trigger Server Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nimbus:latest
            ghcr.io/${{ github.repository_owner }}/nimbus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure Provisioning via Rocky Bot (Zero-Touch Onboarding)
        if: ${{ env.WATCHTOWER_URL != '' }}
        env:
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_WEBHOOK_URL }}
        run: |
          BASE_URL="${WATCHTOWER_URL%/v1/update}"
          echo "🤖 Mengirim sinyal registrasi ke Rocky Provisioning Bot..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "nimbus",
              "title": "Nimbus Downloader",
              "image": "ghcr.io/${{ github.repository_owner }}/nimbus:latest",
              "port": 8000,
              "path": "/nimbus/",
              "icon": "⚡",
              "desc": "Platform self-hosted media & video downloader modern bertenaga yt-dlp, FastAPI, dan WebSockets.",
              "tags": "FastAPI,Python 3.12,yt-dlp,GHCR,Alpine",
              "websocket": true,
              "volumes": ["nimbus_downloads:/app/downloads"],
              "env": ["NIMBUS_PASSWORD=${NIMBUS_PASSWORD:-nimbus123}"]
            }' \
            "${BASE_URL}/api/provision" || true
          echo "✅ Sinyal provisioning selesai!"

      - name: Trigger Watchtower Webhook
        if: ${{ env.WATCHTOWER_URL != '' }}
        env:
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_WEBHOOK_URL }}
        run: |
          echo "🚀 Mengirim sinyal deploy asinkron ke Central Watchtower di server rocky..."
          BASE_URL="${WATCHTOWER_URL%/v1/update}"
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${BASE_URL}/v1/update?async=true" || true
          echo "✅ Sinyal deployment berhasil diterima oleh server rocky!"
